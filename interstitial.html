<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Blocked</title>
  </head>
  <body class="ritual">
    <main id="card">
      <h1 id="headline">Blocked for today</h1>
      <p id="sub"></p>

      <blockquote id="quote"></blockquote>
      <p id="recent-passes" class="muted" hidden></p>

      <form id="ceremony" hidden>
        <label for="quote-answer">Type the quote</label>
        <p id="quote-instructions" class="muted">Match the capitalization and punctuation shown above.</p>
        <textarea id="quote-answer" rows="2" autocomplete="off" autocapitalize="off" spellcheck="false"
          aria-describedby="quote-instructions quote-target"></textarea>
        <p id="typing-status" class="muted" role="status"></p>
        <div class="override-row">
          <button id="override" type="submit" disabled>Quick Override</button>
          <div class="timer" aria-hidden="true"><div id="timer-bar"></div></div>
          <span id="timer-label" aria-live="off"></span>
        </div>
        <p id="passes-left"></p>
      </form>

      <p id="hard-block" hidden>No day-passes left today. This site stays closed until the next reset.</p>

      <div id="escape">
        <button id="go-back" type="button">Go back</button>
        <button id="close-tab" type="button">Close tab</button>
      </div>
    </main>
    <script type="module" src="/src/pages/interstitial/main.ts"></script>
  </body>
</html>
