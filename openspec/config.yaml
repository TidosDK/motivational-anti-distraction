schema: spec-driven

context: |
  Versioning: package.json is the single version source (the build stamps
  dist/manifest.json). Per-feature rhythm: no version bumps while
  implementing (work-in-progress commits are unversioned); when the feature
  is ready for the user to test/validate, bump the minor
  (`npm run version:minor`, e.g. 0.2.0 -> 0.3.0); each round of
  user-requested changes afterwards bumps the patch (`npm run version:patch`,
  e.g. 0.3.1). The next feature takes the next minor when it is ready for
  validation. EVERY version bump is tagged and pushed (`git push
  --follow-tags`), which triggers the GitHub Release workflow. `npm version`
  needs a clean tree: commit first, then bump, then `npm run build`.

  IDEAS.txt is a local-only working notes file: never commit it (it is
  excluded via .git/info/exclude, deliberately not via .gitignore).

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - Do not bump versions while implementing. Hand the feature to the
        user for validation with a minor bump and tag push
        (`npm run version:minor && git push --follow-tags`); each subsequent
        user-requested change round is a tagged patch bump.
  archive:
    guidance:
      - Archiving a change does not bump the version; bumps belong to
        feature readiness and validation rounds, not archiving. Summarize
        the archive outcome before finishing.

