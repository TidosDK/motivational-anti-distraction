schema: spec-driven

context: |
  Versioning: package.json is the single version source (the build stamps
  dist/manifest.json). Bump the patch (`npm run version:patch`) after every
  committed implementation change so the new number is visible in Brave;
  bump the minor (`npm run version:minor`) only when an OpenSpec change is
  finished/archived. `npm version` needs a clean tree: commit first, then
  bump, then `npm run build`.

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
# Example:
#   context: |
#     Designs and tasks must cover Windows, macOS, and Linux
#     Write all artifacts in Spanish

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always state what is out of scope
#     tasks:
#       - Break tasks into chunks of max 2 hours

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
# Example:
#   operations:
#     apply:
#       guidance:
#         - Keep test summaries concise
#     archive:
#       guidance:
#         - Summarize the archive outcome before finishing

operations:
  apply:
    guidance:
      - After completing implementation commits for a task group, bump the
        patch version (`npm run version:patch`) and rebuild, so the version
        number visible in Brave changes with every change.
  archive:
    guidance:
      - As part of finishing a change, bump the minor version
        (`npm run version:minor`) and rebuild before or with the archive.

